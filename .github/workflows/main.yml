name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Find and Build APK
      run: |
        # البحث عن مكان ملف gradlew الحقيقي في المشروع
        GRADLEW_PATH=$(find . -name "gradlew" -type f)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        # استخراج مجلد العمل الذي يوجد فيه gradlew
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found gradlew at: $PROJECT_DIR"
        
        # الانتقال للمجلد ومنح الصلاحية وبناء الـ APK
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug
        
        # نسخ ملف الـ APK الناتج إلى المجلد الرئيسي لتسهيل رفعه كـ Artifact
        mkdir -p ../output-apk
        find . -name "app-debug.apk" -exec cp {} ../output-apk/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: output-apk/app-debug.apk
