name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Gradle Wrapper and Build APK
      run: |
        # البحث عن مجلد المشروع الذي يحتوي على ملف AndroidManifest.xml
        PROJECT_PATH=$(find . -name "AndroidManifest.xml" -maxdepth 3 -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJECT_PATH" ]; then
          PROJECT_PATH="."
        fi
        
        echo "Project detected at: $PROJECT_PATH"
        
        cd "$PROJECT_PATH"
        
        # إنشاء إصدار Gradle متوافق مع المشروع (9.3.1 بناءً على طلب الخطأ)
        gradle wrapper --gradle-version 9.3.1
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Locate and Prepare APK
      run: |
        mkdir -p final-apk
        find . -name "app-debug.apk" -exec cp {} final-apk/ \;

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: final-apk/app-debug.apk
